<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!--CH_HEAD-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collector - Transport V2 Preview</title>
    <script src="/theme-bootstrap.js?v=__COLLECTOR_ASSET_VERSION__"></script>
    <link rel="stylesheet" href="/styles.css?v=__COLLECTOR_ASSET_VERSION__" />
    <!--CH_HEAD_CSS-->
    <script defer src="/theme-control.js?v=__COLLECTOR_ASSET_VERSION__"></script>
  </head>
  <body>
    <main class="container article-page-shell">
      <header class="header">
        <div class="auth-row">
          <!--CH_BRAND-->
          <div class="auth-intro">
            <h1>ระบบจัดการคอนเทนต์</h1>
            <p id="page-subtitle">Preview &amp; Publish — วางทุกสายทับบน base map แล้ว publish ขึ้นเว็บ</p>
            <!--CH_AUTH-->
            <p class="muted" id="workspace-auth-status"></p>
          </div>
        </div>
        <div class="result-banner hidden" id="workspace-status" role="status" aria-live="polite"></div>
      </header>

      <div class="card page-actions-strip">
        <div class="toolbar">
          <button id="btn-back-home" class="utility-action btn-home" type="button">Home</button>
          <button id="btn-process-home" class="utility-action" type="button">Transport</button>
          <button id="btn-open-base-maps" class="utility-action" type="button">Base Maps</button>
          <button id="btn-open-routes" class="utility-action" type="button">Routes</button>
          <select id="preview-base-map" aria-label="Base map"></select>
        </div>
      </div>
      <div class="stack-lg">
        <section class="card article-work-card">
          <div id="preview-stage" class="tv2-stage">
            <div id="stage-controls" class="card tv2-stage-panel">
              <button type="button" id="btn-collapse" class="utility-action tv2-collapse" hidden>–</button>
              <h2 class="section-title" data-compact>Preview</h2>
              <div class="tv2-row">
                <button id="btn-lang-th" class="utility-action" type="button" aria-pressed="true">TH</button>
                <button id="btn-lang-en" class="utility-action" type="button" aria-pressed="false">EN</button>
                <button id="btn-fit" class="utility-action" type="button">Fit</button>
              </div>
              <button id="btn-fullscreen" class="primary tv2-panel-btn" type="button">⛶ เต็มจอ</button>
              <div id="preview-route-list" class="tv2-group"></div>
              <hr class="tv2-sep" />
              <div id="route-card" class="tv2-group" hidden>
                <strong id="route-card-title"></strong>
                <img id="route-card-photo" class="tv2-thumb" alt="" hidden />
                <dl id="route-card-info" class="tv2-info"></dl>
              </div>
              <p id="route-card-empty" class="tv2-tip">แตะเส้นหรือเลือกสายเพื่อดูการ์ด</p>
              <div id="publish-block" class="tv2-group" data-compact>
                <hr class="tv2-sep" />
                <strong>Publish</strong>
                <p class="muted tv2-label" id="publish-live"></p>
                <ul id="publish-problems" class="tv2-text-error"></ul>
                <ul id="publish-warnings"></ul>
                <ul id="publish-skipped" class="muted"></ul>
                <button id="btn-publish" class="primary tv2-panel-btn" type="button">Publish to website</button>
                <span id="publish-status" class="status"></span>
              </div>
            </div>
            <div id="preview-map" class="tv2-stage-map"></div>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="/transport-v2-preview-page.js?v=__COLLECTOR_ASSET_VERSION__"></script>
  </body>
</html>
