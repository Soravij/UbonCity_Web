<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor Portal</title>
    <!--CH_HEAD-->
    <script src="/theme-bootstrap.js?v=__COLLECTOR_ASSET_VERSION__"></script>
    <link rel="stylesheet" href="/styles.css?v=__COLLECTOR_ASSET_VERSION__" />
    <!--CH_HEAD_CSS-->
    <script defer src="/theme-control.js?v=__COLLECTOR_ASSET_VERSION__"></script>
  </head>
  <body>
    <main class="container article-page-shell">
      <header class="header">
        <div class="auth-row">
          <!--CH_BRAND-->
          <div class="auth-intro">
            <h1>ทางเข้างาน Editor</h1>
            <p id="page-subtitle"></p>
            <!--CH_AUTH-->
            <p class="muted" id="workspace-auth-status"></p>
          </div>
        </div>
        <div class="result-banner hidden" id="workspace-status" role="status" aria-live="polite"></div>
      </header>

      <section class="grid">
        <article class="card article-work-card">
          <div class="article-section-head">
            <div>
              <h3 class="section-title">Article Workspace</h3>
              <p class="muted">เข้าไปที่หน้าเขียนบทความ แล้วเลือกงานจากรายการของคุณในหน้านั้น</p>
            </div>
          </div>
          <div class="toolbar">
            <button id="btn-open-article-workspace" class="primary" type="button">เปิด Article Workspace</button>
          </div>
        </article>

        <article class="card article-work-card">
          <div class="article-section-head">
            <div>
              <h3 class="section-title">Event Workspace</h3>
              <p class="muted">เข้าไปที่หน้าเขียนอีเวนต์ แล้วเลือกงานจากรายการของคุณในหน้านั้น</p>
            </div>
          </div>
          <div class="toolbar">
            <button id="btn-open-event-workspace" class="primary" type="button">เปิด Event Workspace</button>
          </div>
        </article>
      </section>
    </main>
    <script type="module" src="/editor-home.js?v=__COLLECTOR_ASSET_VERSION__"></script>
  </body>
</html>
