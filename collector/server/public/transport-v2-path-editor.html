<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!--CH_HEAD-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collector - Transport V2 Path Editor</title>
    <script src="/theme-bootstrap.js?v=__COLLECTOR_ASSET_VERSION__"></script>
    <link rel="stylesheet" href="/styles.css?v=__COLLECTOR_ASSET_VERSION__" />
    <!--CH_HEAD_CSS-->
    <script defer src="/theme-control.js?v=__COLLECTOR_ASSET_VERSION__"></script>
  </head>
  <body>
    <main class="container article-page-shell">
      <header class="header">
        <div class="auth-row">
          <!--CH_BRAND-->
          <div class="auth-intro">
            <h1>ระบบจัดการคอนเทนต์</h1>
            <p id="page-subtitle">Path Editor — ปักจุดเส้นทางและป้ายจอดของสายนี้</p>
            <!--CH_AUTH-->
            <p class="muted" id="workspace-auth-status"></p>
          </div>
        </div>
        <div class="result-banner hidden" id="workspace-status" role="status" aria-live="polite"></div>
      </header>
      <div class="card page-actions-strip">
        <div class="toolbar">
          <button id="btn-back-home" class="utility-action btn-home" type="button">Home</button>
          <button id="btn-process-home" class="utility-action" type="button">Transport</button>
          <button id="btn-open-routes" class="utility-action" type="button">Routes</button>
          <button id="btn-open-preview" class="utility-action" type="button">Preview &amp; Publish</button>
        </div>
      </div>
      <div class="stack-lg">
        <section class="card article-work-card">
          <div id="path-editor-stage" style="position:relative;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start">
            <div id="stage-controls" class="card" style="flex:0 0 220px;width:220px;display:flex;flex-direction:column;gap:6px;padding:8px">
              <button type="button" id="btn-collapse" class="utility-action" style="width:100%;text-align:left" hidden>–</button>
              <div class="article-section-head">
                <div>
                  <h2 class="section-title" id="route-title"></h2>
                  <p class="muted" id="route-meta"></p>
                </div>
              </div>
              <div id="step-list" style="display:flex;flex-direction:column;gap:6px"></div>
              <hr style="border:0;border-top:1px solid var(--line);margin:4px 0;width:100%" />
              <div id="view-group" style="display:flex;flex-direction:column;gap:6px">
                <span class="muted" style="font-size:.85em">มุมมอง</span>
                <button id="btn-fit" class="utility-action" type="button" style="width:100%;text-align:left">Fit</button>
                <button id="btn-fullscreen" class="utility-action" type="button" style="width:100%;text-align:left">เต็มจอ</button>
              </div>
              <p class="muted" id="step-help"></p>
              <p class="muted" id="stage-status" role="status" aria-live="polite"></p>
              <div id="step-actions-pool" hidden>
                <div id="tip-placement" class="muted" style="font-size:.85em;line-height:1.4;padding:6px 8px;border:1px dashed var(--line);border-radius:8px">
                  💡 วางจุด<b>กลางช่วงถนนตรง</b> ไม่ต้องวางที่มุมเลี้ยว — ระบบเลี้ยวตามถนนให้เอง ใช้จุดเฉพาะบอกว่าไปถนนเส้นไหน
                </div>
                <button id="btn-undo-point" class="utility-action" type="button" style="width:100%;text-align:left">ย้อนจุดล่าสุด</button>
                <button id="btn-clear" class="utility-action" type="button" style="width:100%;text-align:left">ล้างจุดทั้งหมด</button>
                <button id="btn-compute" class="primary" type="button" style="width:100%;text-align:left">คำนวณเส้นทาง</button>
                <button id="btn-resolve" class="utility-action" type="button" style="width:100%;text-align:left">คำนวณใหม่</button>
                <button id="btn-undo-stop" class="utility-action" type="button" style="width:100%;text-align:left">ลบป้ายล่าสุด</button>
              </div>
            </div>
            <div id="path-editor-map" style="flex:1 1 320px;min-width:0;height:70vh;min-height:360px;border-radius:12px;overflow:hidden;background:#f6f1e7"></div>
            <button type="button" id="warn-banner" hidden style="position:absolute;top:12px;right:12px;z-index:11;background:#dc2626 !important;color:#fff !important;border:0 !important;border-radius:999px;padding:8px 14px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer"></button>
          </div>
        </section>
        <section class="card article-work-card">
          <p class="muted" id="point-count"></p>
          <h3 class="section-title">ป้ายจอด</h3>
          <ul id="stop-list"></ul>
          <label class="muted" for="share-link">ลิงก์หน้านี้</label>
          <input id="share-link" type="text" readonly />
        </section>
      </div>
    </main>
    <script type="module" src="/transport-v2-path-editor-page.js?v=__COLLECTOR_ASSET_VERSION__"></script>
  </body>
</html>
