<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!--CH_HEAD-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collector - Transport V2 Path Editor</title>
    <script src="/theme-bootstrap.js?v=__COLLECTOR_ASSET_VERSION__"></script>
    <link rel="stylesheet" href="/styles.css?v=__COLLECTOR_ASSET_VERSION__" />
    <!--CH_HEAD_CSS-->
    <script defer src="/theme-control.js?v=__COLLECTOR_ASSET_VERSION__"></script>
  </head>
  <body>
    <main class="container article-page-shell">
      <header class="header">
        <div class="auth-row">
          <!--CH_BRAND-->
          <div class="auth-intro">
            <h1>ระบบจัดการคอนเทนต์</h1>
            <p id="page-subtitle">Path Editor — ปักจุดเส้นทางและป้ายจอดของสายนี้</p>
            <!--CH_AUTH-->
            <p class="muted" id="workspace-auth-status"></p>
          </div>
        </div>
        <div class="result-banner hidden" id="workspace-status" role="status" aria-live="polite"></div>
      </header>
      <div class="card page-actions-strip">
        <div class="toolbar">
          <button id="btn-back-home" class="utility-action btn-home" type="button">Home</button>
          <button id="btn-process-home" class="utility-action" type="button">Transport</button>
          <button id="btn-open-routes" class="utility-action" type="button">Routes</button>
          <button id="btn-open-preview" class="utility-action" type="button">Preview &amp; Publish</button>
        </div>
      </div>
      <div class="stack-lg">
        <section class="card article-work-card">
          <div id="path-editor-stage" class="tv2-stage">
            <div id="stage-controls" class="card tv2-stage-panel">
              <button type="button" id="btn-collapse" class="utility-action tv2-collapse" hidden>–</button>
              <div class="article-section-head">
                <div>
                  <h2 class="section-title" id="route-title" data-compact></h2>
                  <p class="muted" id="route-meta" data-compact></p>
                </div>
              </div>
              <div id="kind-group" class="tv2-group">
                <span class="muted tv2-label">รูปแบบสาย</span>
                <div class="tv2-row">
                  <button id="btn-kind-loop" class="utility-action" type="button">วน</button>
                  <button id="btn-kind-outback" class="utility-action" type="button">ไป-กลับ</button>
                </div>
                <div id="leg-switch" class="tv2-row" hidden>
                  <button id="btn-leg-out" class="utility-action" type="button">ขาไป</button>
                  <button id="btn-leg-back" class="utility-action" type="button">ขากลับ</button>
                </div>
                <button id="btn-build-back" class="utility-action tv2-panel-btn" type="button" hidden>สร้างขากลับจากขาไป</button>
              </div>
              <div id="step-list" class="tv2-group"></div>
              <hr class="tv2-sep" />
              <div id="view-group" class="tv2-group">
                <span class="muted tv2-label">มุมมอง</span>
                <button id="btn-fit" class="utility-action tv2-panel-btn" type="button">Fit</button>
                <button id="btn-fullscreen" class="utility-action tv2-panel-btn" type="button">เต็มจอ</button>
              </div>
              <p class="muted" id="step-help" data-compact></p>
              <p class="muted" id="stage-status" data-compact role="status" aria-live="polite"></p>
              <div id="step-actions-pool" hidden>
                <div id="tip-placement" class="muted tv2-tip">
                  💡 วางจุด<b>กลางช่วงถนนตรง</b> ไม่ต้องวางที่มุมเลี้ยว — ระบบเลี้ยวตามถนนให้เอง ใช้จุดเฉพาะบอกว่าไปถนนเส้นไหน
                </div>
                <button id="btn-undo-point" class="utility-action tv2-panel-btn" type="button">ย้อนจุดล่าสุด</button>
                <button id="btn-clear" class="utility-action tv2-panel-btn" type="button">ล้างจุดทั้งหมด</button>
                <button id="btn-compute" class="primary tv2-panel-btn" type="button">คำนวณเส้นทาง</button>
                <button id="btn-resolve" class="utility-action tv2-panel-btn" type="button">คำนวณใหม่</button>
                <button id="btn-undo-stop" class="utility-action tv2-panel-btn" type="button">ลบป้ายล่าสุด</button>
              </div>
            </div>
            <div id="path-editor-map" class="tv2-stage-map"></div>
            <button type="button" id="warn-banner" class="tv2-warn-banner fail" hidden></button>
          </div>
        </section>
        <section class="card article-work-card">
          <p class="muted" id="point-count"></p>
          <h3 class="section-title">ป้ายจอด</h3>
          <ul id="stop-list"></ul>
          <label class="muted" for="share-link">ลิงก์หน้านี้</label>
          <input id="share-link" type="text" readonly />
        </section>
      </div>
    </main>
    <script type="module" src="/transport-v2-path-editor-page.js?v=__COLLECTOR_ASSET_VERSION__"></script>
  </body>
</html>
