<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!--CH_HEAD-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collector - Transport V2 Path Editor</title>
    <script src="/theme-bootstrap.js?v=__COLLECTOR_ASSET_VERSION__"></script>
    <link rel="stylesheet" href="/styles.css?v=__COLLECTOR_ASSET_VERSION__" />
    <!--CH_HEAD_CSS-->
    <script defer src="/theme-control.js?v=__COLLECTOR_ASSET_VERSION__"></script>
  </head>
  <body>
    <main class="container article-page-shell">
      <header class="header">
        <div class="auth-row">
          <!--CH_BRAND-->
          <div class="auth-intro">
            <h1>ระบบจัดการคอนเทนต์</h1>
            <p id="page-subtitle">Path Editor — ปักจุดเส้นทางและป้ายจอดของสายนี้</p>
            <!--CH_AUTH-->
            <p class="muted" id="workspace-auth-status"></p>
          </div>
        </div>
        <div class="result-banner hidden" id="workspace-status" role="status" aria-live="polite"></div>
      </header>
      <div class="card page-actions-strip">
        <div class="toolbar">
          <button id="btn-back-home" class="utility-action btn-home" type="button">Home</button>
          <button id="btn-process-home" class="utility-action" type="button">Transport</button>
          <button id="btn-open-routes" class="utility-action" type="button">Routes</button>
          <button id="btn-open-preview" class="utility-action" type="button">Preview &amp; Publish</button>
        </div>
      </div>
      <div class="stack-lg">
        <section class="card article-work-card">
          <div id="path-editor-stage">
            <div class="article-section-head">
              <div>
                <h2 class="section-title" id="route-title"></h2>
                <p class="muted" id="route-meta"></p>
              </div>
            </div>
            <div class="toolbar">
              <button id="btn-step-1" class="utility-action" type="button">1 · ปักจุด</button>
              <button id="btn-step-2" class="utility-action" type="button">2 · ปรับเส้นทาง</button>
              <button id="btn-step-3" class="utility-action" type="button">3 · ปักป้าย</button>
              <button id="btn-fit" class="utility-action" type="button">Fit</button>
              <button id="btn-fullscreen" class="utility-action" type="button">เต็มจอ</button>
            </div>
            <div class="toolbar" id="step-tools-1">
              <button id="btn-undo-point" class="utility-action" type="button">ย้อนจุดล่าสุด</button>
              <button id="btn-clear" class="utility-action" type="button">ล้างจุดทั้งหมด</button>
              <button id="btn-compute" class="primary" type="button">คำนวณเส้นทาง</button>
            </div>
            <div class="toolbar hidden" id="step-tools-2">
              <button id="btn-resolve" class="utility-action" type="button">คำนวณใหม่</button>
            </div>
            <div class="toolbar hidden" id="step-tools-3">
              <button id="btn-undo-stop" class="utility-action" type="button">ลบป้ายล่าสุด</button>
            </div>
            <p class="muted" id="step-help"></p>
            <p class="muted" id="stage-status" role="status" aria-live="polite"></p>
            <div id="path-editor-map" style="height: 70vh; min-height: 360px; border-radius: 12px; overflow: hidden; background: #f6f1e7;"></div>
          </div>
        </section>
        <section class="card article-work-card">
          <p class="muted" id="point-count"></p>
          <h3 class="section-title">ป้ายจอด</h3>
          <ul id="stop-list"></ul>
          <label class="muted" for="share-link">ลิงก์หน้านี้</label>
          <input id="share-link" type="text" readonly />
        </section>
      </div>
    </main>
    <script type="module" src="/transport-v2-path-editor-page.js?v=__COLLECTOR_ASSET_VERSION__"></script>
  </body>
</html>
