services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/migrations/000_baseline_schema.sql:/docker-entrypoint-initdb.d/000_baseline_schema.sql:ro
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","127.0.0.1","-p${DB_PASSWORD}"]
      interval: 10s
      retries: 10
  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    env_file: [.env.docker]
    environment:
      DB_HOST: mysql
    depends_on:
      mysql: { condition: service_healthy }
    volumes:
      - backend-uploads:/app/backend/uploads
    ports: ["5000:5000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_INDEXING: ${NEXT_PUBLIC_INDEXING}
    depends_on: [backend]
    ports: ["3000:3000"]
    restart: unless-stopped
  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL}
        VITE_COLLECTOR_BASE_URL: ${VITE_COLLECTOR_BASE_URL}
    depends_on: [backend]
    ports: ["8080:80"]
    restart: unless-stopped
volumes:
  mysql-data:
  backend-uploads: